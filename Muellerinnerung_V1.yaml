blueprint:
  name: IHA Müllerinnerung V1
  description: >
    Erinnert am Vorabend der Abholung per Push daran, den Müll rauszustellen,
    optional zusätzlich am Morgen des Abholtags.
    Grundlage ist der Template-Sensor sensor.abfall_in_tagen aus der IHA Einrichtung
    (Zustand z. B. "Morgen - Restmüll" oder "Heute - Biomüll").
    In den Texten wird {art} durch die Müllart ersetzt.
  domain: automation
  author: Patric Schneider
  source_url: https://github.com/RWD18149/IHA/blob/main/Muellerinnerung_V1.yaml
  input:
    abfall_sensor:
      name: Abfallsensor
      description: Template-Sensor aus der IHA Einrichtung.
      default: sensor.abfall_in_tagen
      selector:
        entity:
          domain: sensor
    vorabend:
      name: Erinnerung am Vorabend
      icon: mdi:delete-clock
      input:
        zeit_vorabend:
          name: Uhrzeit
          default: "18:00:00"
          selector:
            time: {}
        text_vorabend:
          name: Text
          description: "{art} wird durch die Müllart ersetzt."
          default: "Morgen wird {art} abgeholt. Bitte stellen Sie den Müll heute Abend raus."
          selector:
            text: {}
    morgens:
      name: Erinnerung am Abholtag (optional)
      icon: mdi:weather-sunset-up
      collapsed: true
      input:
        morgens_aktiv:
          name: Auch am Morgen des Abholtags erinnern
          default: false
          selector:
            boolean: {}
        zeit_morgens:
          name: Uhrzeit
          default: "06:30:00"
          selector:
            time: {}
        text_morgens:
          name: Text
          description: "{art} wird durch die Müllart ersetzt."
          default: "Heute wird {art} abgeholt. Bitte stellen Sie den Müll raus, falls noch nicht geschehen."
          selector:
            text: {}
    benachrichtigung:
      name: Benachrichtigung
      icon: mdi:cellphone-message
      input:
        geraete:
          name: Handys
          description: Handys mit der Home-Assistant-App, die die Erinnerung bekommen.
          default: []
          selector:
            device:
              integration: mobile_app
              multiple: true
        notify_actions:
          name: Weitere Benachrichtigungs-Aktionen (optional)
          description: Eine pro Zeile, z. B. für Alexa oder eine Gruppe. Für Handys reicht die Auswahl oben.
          default: []
          selector:
            text:
              multiple: true
        titel:
          name: Titel
          default: Müll
          selector:
            text: {}

triggers:
  - trigger: time
    at: !input zeit_vorabend
    id: vorabend
  - trigger: time
    at: !input zeit_morgens
    id: morgens

variables:
  abfall_sensor: !input abfall_sensor
  morgens_aktiv: !input morgens_aktiv
  text_vorabend: !input text_vorabend
  text_morgens: !input text_morgens
  geraete: !input geraete
  notify_extra: !input notify_actions
  titel: !input titel
  zustand: "{{ states(abfall_sensor) }}"
  art: >
    {% if ' - ' in zustand %}{{ zustand.split(' - ', 1)[1] | trim }}{% else %}Müll{% endif %}
  nachricht: >
    {% if trigger.id == 'vorabend' and zustand.startswith('Morgen') %}
      {{ text_vorabend | replace('{art}', art) }}
    {% elif trigger.id == 'morgens' and morgens_aktiv and zustand.startswith('Heute') %}
      {{ text_morgens | replace('{art}', art) }}
    {% endif %}
  notify_list: >
    {% set ns = namespace(l=[]) %}
    {% for d in geraete %}
      {% set n = device_attr(d, 'name') %}
      {% if n %}{% set ns.l = ns.l + ['notify.mobile_app_' ~ (n | slugify)] %}{% endif %}
    {% endfor %}
    {{ ns.l + (notify_extra | list) }}

conditions:
  - condition: template
    value_template: "{{ nachricht | trim != '' }}"

actions:
  - repeat:
      for_each: "{{ notify_list }}"
      sequence:
        - action: "{{ repeat.item }}"
          continue_on_error: true
          data:
            title: "{{ titel }}"
            message: "{{ nachricht | trim }}"

mode: single
