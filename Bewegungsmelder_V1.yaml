blueprint:
  name: Bewegungslicht
  description: >
    Schaltet Lichter bei Bewegung ein und nach Ablauf der Nachlaufzeit aus.
    Die Ausschalt-Liste kann mehr Lichter enthalten als die Einschalt-Liste.
  domain: automation
    source_url: https://github.com/RWD18149/IHA/blob/main/Bewegungsmelder_V1.yaml
  input:
    motion_sensors:
      name: Bewegungsmelder
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    lights_on:
      name: Einschalten
      selector:
        entity:
          domain: light
          multiple: true
    lights_off:
      name: Ausschalten
      description: Leer lassen, um dieselben Lichter wie beim Einschalten auszuschalten.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    delay_minutes:
      name: Nachlaufzeit (Minuten)
      default: 3
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    brightness:
      name: Helligkeit (0 = Helligkeit nicht setzen)
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    nacht:
      name: Nachtmodus
      icon: mdi:weather-night
      collapsed: true
      input:
        night_enabled:
          name: Nachtmodus aktiv
          default: false
          selector:
            boolean: {}
        night_start:
          name: Nacht von
          default: "23:00:00"
          selector:
            time: {}
        night_end:
          name: Nacht bis
          default: "06:00:00"
          selector:
            time: {}
        night_lights:
          name: Nachtlichter (leer = normale Lichter)
          default: []
          selector:
            entity:
              domain: light
              multiple: true
        night_brightness:
          name: Nachthelligkeit
          default: 10
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        night_delay_minutes:
          name: Nachlaufzeit Nacht (Minuten)
          default: 2
          selector:
            number:
              min: 1
              max: 60
              unit_of_measurement: min
    umgebung:
      name: Helligkeitssensor
      icon: mdi:brightness-6
      collapsed: true
      input:
        lux_sensor:
          name: Helligkeitssensor (optional)
          default: ""
          selector:
            entity:
              domain: sensor
        lux_threshold:
          name: Nur einschalten unter
          default: 50
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx
    sperre:
      name: Sperre
      icon: mdi:motion-sensor-off
      collapsed: true
      input:
        block_entity:
          name: Sperre (optional, bei „an“ passiert nichts)
          default: ""
          selector:
            entity:
              domain:
                - switch
                - input_boolean

triggers:
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"

variables:
  motion_sensors: !input motion_sensors
  lights_on_in: !input lights_on
  lights_off_in: !input lights_off
  delay_minutes: !input delay_minutes
  brightness: !input brightness
  night_enabled: !input night_enabled
  night_start: !input night_start
  night_end: !input night_end
  night_lights_in: !input night_lights
  night_brightness: !input night_brightness
  night_delay_minutes: !input night_delay_minutes
  lux_sensor: !input lux_sensor
  lux_threshold: !input lux_threshold
  block_entity: !input block_entity
  is_night: >
    {% if not night_enabled %}false
    {% else %}
      {% set n = now().strftime('%H:%M:%S') %}
      {% if night_start <= night_end %}{{ night_start <= n < night_end }}
      {% else %}{{ n >= night_start or n < night_end }}{% endif %}
    {% endif %}
  target_on: >
    {{ night_lights_in if (is_night and night_lights_in | length > 0) else lights_on_in }}
  target_off: >
    {% set base = lights_off_in if lights_off_in | length > 0 else lights_on_in %}
    {{ (base + night_lights_in) | unique | list }}
  bright: "{{ night_brightness if is_night else brightness }}"
  wait_min: "{{ night_delay_minutes if is_night else delay_minutes }}"
  any_light_on: "{{ target_off | select('is_state', 'on') | list | length > 0 }}"
  too_bright: >
    {% if lux_sensor %}{{ states(lux_sensor) | float(0) > lux_threshold | float(0) }}
    {% else %}false{% endif %}

conditions:
  - condition: template
    value_template: "{{ not block_entity or not is_state(block_entity, 'on') }}"

actions:
  - condition: template
    value_template: "{{ not too_bright or any_light_on }}"
  - variables:
      to_switch_on: "{{ target_on | reject('is_state', 'on') | list }}"
  - if:
      - condition: template
        value_template: "{{ to_switch_on | length > 0 }}"
    then:
      - if:
          - condition: template
            value_template: "{{ bright | int(0) > 0 }}"
        then:
          - action: light.turn_on
            target:
              entity_id: "{{ to_switch_on }}"
            data:
              brightness_pct: "{{ bright | int }}"
        else:
          - action: light.turn_on
            target:
              entity_id: "{{ to_switch_on }}"
  - wait_template: "{{ motion_sensors | select('is_state', 'on') | list | length == 0 }}"
  - delay:
      minutes: "{{ wait_min | int }}"
  - action: light.turn_off
    target:
      entity_id: "{{ target_off }}"

mode: restart
max_exceeded: silent
