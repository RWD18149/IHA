blueprint:
  name: IHA Thermostat Stellmotor
  description: >
    Schaltet einen oder mehrere Stellmotoren (Schalter) passend zu einem Thermostat.
    Ist die Raumtemperatur unter dem Sollwert, öffnet der Stellmotor, ist sie erreicht, schließt er.
    Der Sollwert wird weiter am Thermostat eingestellt, z. B. am Homematic-Wandthermostat oder über den IHA Heizkalender.
  domain: automation
  author: IHA
  input:
    thermostat:
      name: Thermostat
      description: Thermostat, das Ist- und Solltemperatur liefert (z. B. Homematic).
      selector:
        entity:
          domain: climate
    stellmotoren:
      name: Stellmotoren
      description: Ein oder mehrere Schalter, die die Stellmotoren dieses Raums ansteuern.
      selector:
        entity:
          domain: switch
          multiple: true
    hysterese:
      name: Hysterese
      description: >
        Schaltabstand um den Sollwert. Bei 0,3 °C und Soll 21 °C öffnet der Stellmotor unter 20,7 °C
        und schließt ab 21,3 °C. Verhindert ständiges Hin- und Herschalten.
      default: 0.3
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          unit_of_measurement: "°C"
          mode: slider

mode: queued
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input thermostat
  - platform: state
    entity_id: !input thermostat
    attribute: current_temperature
  - platform: state
    entity_id: !input thermostat
    attribute: temperature
  - platform: homeassistant
    event: start
  - platform: time_pattern
    minutes: "/5"

variables:
  thermostat: !input thermostat
  stellmotoren: !input stellmotoren
  hysterese: !input hysterese
  modus: "{{ states(thermostat) }}"
  ist: "{{ state_attr(thermostat, 'current_temperature') }}"
  soll: "{{ state_attr(thermostat, 'temperature') }}"
  werte_ok: "{{ ist is number and soll is number }}"

action:
  - choose:
      # Thermostat aus: Stellmotoren schließen
      - conditions:
          - condition: template
            value_template: "{{ modus == 'off' }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ stellmotoren }}"
      # Keine gültigen Werte (Thermostat nicht erreichbar): nichts ändern
      - conditions:
          - condition: template
            value_template: "{{ not werte_ok }}"
        sequence: []
      # Zu kalt: Stellmotoren öffnen
      - conditions:
          - condition: template
            value_template: "{{ ist < soll - hysterese }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ stellmotoren }}"
      # Warm genug: Stellmotoren schließen
      - conditions:
          - condition: template
            value_template: "{{ ist >= soll + hysterese }}"
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ stellmotoren }}"
